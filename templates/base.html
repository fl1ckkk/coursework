<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Оренда обладнання{% endblock %}</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 960px; margin: 0 auto; padding: 1rem; line-height: 1.5; }
    header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #ccc; margin-bottom: 1rem; }
    a { color: #0b5cad; }
    .card { border: 1px solid #ddd; border-radius: 6px; padding: .75rem 1rem; margin-bottom: .75rem; }
    .muted { color: #555; }
    form.inline { display: inline; }
  </style>
</head>
<body>
<header>
  <a href="{% url 'catalog:list' %}"><strong>Оренда обладнання</strong></a>
  <nav>
    {% if user.is_authenticated %}
      {{ user }} ({{ user.get_role_display }})
      <form class="inline" method="post" action="{% url 'logout' %}">{% csrf_token %}<button type="submit">Вийти</button></form>
    {% else %}
      <a href="{% url 'login' %}">Увійти</a>
    {% endif %}
  </nav>
</header>
<main>
  {% block content %}{% endblock %}
</main>
</body>
</html>
