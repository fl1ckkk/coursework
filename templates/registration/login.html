{% extends "base.html" %}
{% block title %}Вхід{% endblock %}
{% block content %}
<h1>Вхід</h1>
<form method="post">
  {% csrf_token %}
  {{ form.non_field_errors }}
  {% for field in form %}
    <div class="form-row">
      {{ field.label_tag }}
      {{ field }}
      {{ field.errors }}
    </div>
  {% endfor %}
  <input type="hidden" name="next" value="{{ next }}">
  <button type="submit" class="primary">Увійти</button>
</form>
<p>Немає облікового запису? <a href="{% url 'register' %}">Зареєструватися</a></p>
{% endblock %}
